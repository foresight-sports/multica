services:
  tunnel-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      - tunnel-proxy
    command: [tunnel, --no-autoupdate, --protocol, http2, --metrics, "0.0.0.0:2000", run, --token-file, /run/secrets/tunnel-token]
    volumes:
      - ../tunnel/token.txt:/run/secrets/tunnel-token:ro
